<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Exercise</title>
</head>
<body>
    <form method="post">
        <label for="first-name">First Name</label>
        <input type="text" name="first-name" id="first-name">
        <br>
        <label for="last-name">Last Name</label>
        <input type="text" name="last-name" id="last-name">
        <br>
        <label for="birth-date">Birth Date</label>
        <input type="date" name="birth-date" id="birth-date">
        <br>
        <p>Gender:</p>
        <input type="radio" value="male" name="gender" id="gender-male">Male <br>
        <input type="radio" value="female" name="gender" id="gender-female">Female <br>
        <input type="radio" value="other" name="gender" id="gender-other">Other <br>
        <input type="radio" value="dnd" name="gender" id="gender-dnd">Do Not Declare <br> <br>
        <label for="password">Password</label>
        <input type="password" name="password" id="password"> <br> <br>
        <label for="text-area">Short biography:</label>
        <textarea name="biography" id="text-area"></textarea> <br>
        <label for="color">Favorite color:</label>
        <input type="color" name="color" id="color"> <br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
